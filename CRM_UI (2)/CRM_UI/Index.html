function side(){let dashboardMenu=page==='dashboard'?`<div class="subnav"><button class="${dashboardView==='loan'?'sel':''}" onclick="openDashboard('loan')">Loan Opportunities</button><button class="${dashboardView==='investment'?'sel':''}" onclick="openDashboard('investment')">Investment Opportunities</button></div>`:'';let settingsMenu=page==='settings'?`<div class="subnav"><button class="${setting==='pipeline'?'sel':''}" onclick="chooseSetting('pipeline')">Opportunity stages</button><button class="${setting==='forms'?'sel':''}" onclick="chooseSetting('forms')">Object form configuration</button><button class="${setting==='validations'?'sel':''}" onclick="chooseSetting('validations')">Validations</button><button>Reference data</button><button>User management</button><button>Audit log</button></div>`:'';return `<aside class="sidebar"><div class="logo"><b></b>PrivateInvest</div>${nav.map(n=>`<button class="nav ${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="glyph">${n[1]}</span>${n[2]}</button>${n[0]==='dashboard'?dashboardMenu:''}${n[0]==='settings'?settingsMenu:''}`).join('')}<div class="status"><span class="dot"></span>System connected</div></aside>`}
function shell(content,crumb){return `<div class="shell">${side()}<main class="main"><header class="bar"><span class="crumb">Settings / ${crumb}</span><span class="user"><span class="avatar">AS</span> Alex Stewart</span></header><section class="page">${content}</section></main></div>`}
function pipeline(){return shell(`<div class="page-head"><div><h1>Pipeline configuration</h1><p>Build pipelines, reorder stages and manage the custom fields required at each stage.</p></div><button class="btn primary" onclick="alert('Pipeline configuration saved')">Save changes</button></div><div class="config-layout"><section class="card card-pad"><h2>Credit Pipeline</h2><p class="helper">Drag or use the arrows to change stage order. Every stage can have its own fields and rules.</p><div class="pipeline-list">${stages.map((s,i)=>`<div class="stage-card ${i===selectedStage?'selected':''}" onclick="pickStage(${i})"><span class="handle">⠿</span><span class="number">${i+1}</span><span><b>${s}</b><small>${[9,4,6,3,4,2][i]||0} custom fields</small></span><span class="stage-actions"><button class="mini" ${i===0?'disabled':''} onclick="event.stopPropagation();reorder(${i},-1)">↑</button><button class="mini" ${i===stages.length-1?'disabled':''} onclick="event.stopPropagation();reorder(${i},1)">↓</button></span></div>`).join('')}</div><div class="add-stage"><input id="stageName" class="input" placeholder="Stage name"><button class="btn ghost-red" onclick="addStage()">＋ Add stage</button></div></section><section class="card card-pad"><div class="field-head"><div><h2>${stages[selectedStage]} stage</h2><p class="helper">Choose the fields users complete at this stage.</p></div><button class="btn primary" onclick="addCustomField()">＋ Add custom field</button></div><div class="tabs"><button>Stage details</button><button class="active">Fields</button></div><div class="field-table"><div class="tr th"><span>Field name</span><span>Type</span><span>Required</span><span>Validation</span><span></span></div>${stageFields().map((f,i)=>`<div class="tr ${i===selectedField?'chosen':''}" onclick="selectedField=${i};render()"><span><b>${f[0]}</b></span><span>${f[1]}</span><span><span class="tag ${f[2]==='No'?'gray':''}">${f[2]}</span></span><span>${f[3]}</span><span>⋮</span></div>`).join('')}</div></section>${fieldInspector()}</div>`,'Pipeline configuration')}
function stageFields(){return [['Committee paper','Single select','Yes','Must select'],['Decision date','Date','Yes','Valid date'],['Recommended terms','Long text','No','Max 500 characters'],['Key risks and mitigants','Long text','Yes','Max 1,000 characters']];}
function fieldInspector(){let f=stageFields()[selectedField];return `<aside class="card card-pad inspector"><h2>Edit field</h2><div class="form-group"><label>Field type</label><select class="select"><option>${f[1]}</option><option>Text</option><option>Numeric</option><option>Boolean</option><option>Date</option><option>Single select</option><option>Multi select</option><option>Checkbox group</option><option>Radio group</option><option>Long text</option></select></div><div class="form-group"><label>Label</label><input class="input" value="${f[0]}"></div><div class="form-group switch-row"><label>Required</label><input class="switch" type="checkbox" ${f[2]==='Yes'?'checked':''}></div><div class="form-group"><label>Validation rule</label><select class="select"><option>${f[3]}</option><option>None</option><option>Must select a value</option><option>Maximum 500 characters</option></select></div><div class="notice">Expected fields help data quality. Only approved hard gates block a stage action.</div></aside>`}
function forms(){let form=objects[selectedObject];return shell(`<div class="page-head"><div><h1>Object form configuration</h1><p>Default fields stay available. Configure additional fields, layout and validation for every CRM object.</p></div><button class="btn primary" onclick="alert('Object form saved')">Save changes</button></div><div class="object-layout"><section class="card object-menu"><div class="card-pad"><h2>CRM objects</h2><p class="helper">Select an object to manage its form.</p></div>${Object.keys(objects).map(x=>`<button class="${selectedObject===x?'selected':''}" onclick="selectedObject='${x}';render()">${x}<small style="float:right;color:#8b97a8">${objects[x].length} fields</small></button>`).join('')}</section><section class="card card-pad"><div class="field-head"><div><h2>${selectedObject} form</h2><p class="helper">Fields are grouped as standard fields and configurable custom fields.</p></div><button class="btn primary" onclick="openFieldDialog()">＋ Add custom field</button></div><div class="tabs"><button class="active">Fields</button><button>Layout</button><button>Rules</button></div><p class="system-label">Standard and custom fields</p><div class="field-table"><div class="tr th"><span>Field name</span><span>Type</span><span>Required</span><span>Validation</span><span></span></div>${form.map(f=>`<div class="tr"><span><b>${f[0]}</b></span><span>${f[1]}</span><span><span class="tag ${f[2]==='Optional'?'gray':''}">${f[2]}</span></span><span>${f[3]}</span><span>⋮</span></div>`).join('')}</div></section><aside class="card card-pad"><h2>Form rules</h2><p class="helper">Control field visibility, required state and defaults without development.</p><div class="rule"><i>✓</i><span><b>Default fields</b><br><small class="helper">System fields remain available</small></span></div><div class="rule"><i>✓</i><span><b>Validation</b><br><small class="helper">Configure at field level</small></span></div><div class="rule"><i>✓</i><span><b>Permissions</b><br><small class="helper">Show fields by authorised role</small></span></div><button class="btn" style="margin-top:16px" onclick="alert('Display rule builder opened')">＋ Add display rule</button></aside></div>`,'Object form configuration')}
function peoplePage(){return shell(`<div class="page-head"><div><h1>People</h1><p>One record for each natural person, with their relationships and CRM activity in one place.</p></div><button class="btn primary" onclick="openPersonDialog()">＋ New person</button></div><div class="filter-bar"><input id="peopleSearch" class="input" placeholder="⌕ Search people" oninput="filterPeople(this.value)"><select class="select"><option>All person types</option><option>Broker</option><option>Borrower or Sponsor</option><option>Investor</option></select><select class="select"><option>All relationship statuses</option><option>Active</option><option>Prospect</option></select><button class="btn" onclick="alert('List export recorded in the audit trail')">Export</button><span style="margin-left:auto;color:#738096;font-size:12px">${people.length} people</span></div><div class="table-wrap"><div class="record-table"><div class="record-row head"><span>Person</span><span>Type</span><span>Entity</span><span>Relationship</span><span>Owner</span><span>Status</span><span></span></div><div id="peopleRows">${people.map((p,i)=>personRow(p,i)).join('')}</div></div></div>`,'People')}
function personRow(p,i){return `<div class="record-row"><a href="#" class="record-name" onclick="event.preventDefault();personDetail(${i})"><span class="avatar" style="display:inline-grid;vertical-align:middle;margin-right:8px">${p.initials}</span>${p.name}</a><span class="type-chip">${p.type}</span><a href="#" class="record-name" onclick="event.preventDefault();entityDetail(${i===0||i===1?0:i===2?1:i===3?2:3})">${p.entity}</a><span>${p.roles}</span><span>${p.owner}</span><span class="status-pill ${p.status==='Active'?'progress':'open'}">${p.status}</span><button class="mini">⋮</button></div>`}
function filterPeople(q){q=q.toLowerCase();document.querySelector('#peopleRows').innerHTML=people.filter(p=>(p.name+p.entity+p.type).toLowerCase().includes(q)).map((p,i)=>personRow(p,i)).join('')||'<div class="empty">No people match this search.</div>'}
function personDetail(i){let p=people[i];document.querySelector('#app').innerHTML=shell(`<div class="page-head"><div><button class="card-link" onclick="go('people')">← Back to people</button><h1 style="margin-top:8px">${p.name}</h1><p>${p.type} · ${p.entity}</p></div><div class="quick-actions"><button class="btn" onclick="alert('Teams dialler would open for ${p.phone}')">☎ Call</button><button class="btn" onclick="alert('Outlook would open for ${p.email}')">✉ Email</button><button class="btn primary" onclick="openTaskDialog('${p.name}')">＋ Task</button></div></div><div class="record-layout"><div><section class="card card-pad"><div class="field-head"><div><h2>Person details</h2><p class="helper">Core identity and relationship information.</p></div><button class="btn">Edit</button></div><dl class="contact-card"><div><dt>Email</dt><dd><a class="record-name" href="mailto:${p.email}">${p.email}</a></dd></div><div><dt>Phone</dt><dd><a class="record-name" href="tel:${p.phone}">${p.phone}</a></dd></div><div><dt>Person type</dt><dd>${p.type}</dd></div><div><dt>Relationship status</dt><dd>${p.status}</dd></div><div><dt>Primary entity</dt><dd><a href="#" class="record-name" onclick="event.preventDefault();entityDetail(${i===0||i===1?0:i===2?1:i===3?2:3})">${p.entity}</a></dd></div><div><dt>Owner</dt><dd>${p.owner}</dd></div></dl></section><section class="card card-pad" style="margin-top:16px"><div class="field-head"><div><h2>Activity history</h2><p class="helper">Email and call pointers retain metadata only. Notes remain append-only.</p></div><button class="btn" onclick="openNoteDialog('${p.name}')">＋ Add note</button></div><div class="timeline"><div class="event"><b>Call with ${p.name}</b><small>Outbound · 14 minutes · Today, 10:35 · Alex Stewart</small></div><div class="event"><b>Email pointer: Updated information request</b><small>To ${p.email} · Yesterday, 16:20 · Attachment names stored</small></div><div class="event"><b>Note added</b><small>"Confirmed next steps for diligence." · 21 Oct 2026 · Alex Stewart</small></div></div></section></div><aside><section class="card card-pad"><h2>Open tasks</h2><div class="rule"><i>!</i><span><b>Follow up on financials</b><br><small class="helper">Due 14 Apr · High priority</small></span></div><div class="rule"><i>✓</i><span><b>Confirm identity documents</b><br><small class="helper">Due 17 Apr · Normal priority</small></span></div><button class="btn" style="margin-top:15px" onclick="openTaskDialog('${p.name}')">＋ Assign task</button></section><section class="card card-pad" style="margin-top:16px"><h2>Roles and links</h2><p class="helper">${p.roles}</p><button class="btn">Manage links</button></section></aside></div>`,'People / '+p.name)}
function entitiesPage(){return shell(`<div class="page-head"><div><h1>Entities</h1><p>Organisations and legal structures linked to people, opportunities and roles.</p></div><button class="btn primary" onclick="openEntityDialog()">＋ New entity</button></div><div class="gate">Hard gate G1: the CRM blocks an Entity save when an ACN or ABN already exists. Format validation is also applied before saving.</div><div class="filter-bar" style="margin-top:18px"><input id="entitySearch" class="input" placeholder="⌕ Search entities" oninput="filterEntities(this.value)"><select class="select"><option>All entity types</option><option>Developer</option><option>Broker Firm</option><option>Family Office</option></select><select class="select"><option>All relationship statuses</option><option>Active</option><option>Prospect</option></select><button class="btn" onclick="alert('List export recorded in the audit trail')">Export</button><span style="margin-left:auto;color:#738096;font-size:12px">${entities.length} entities</span></div><div class="table-wrap"><div class="record-table"><div class="record-row head"><span>Entity</span><span>Entity type</span><span>ACN / ABN</span><span>Relationship</span><span>Owner</span><span>Status</span><span></span></div><div id="entityRows">${entities.map((e,i)=>entityRow(e,i)).join('')}</div></div></div>`,'Entities')}
function entityRow(e,i){return `<div class="record-row"><a href="#" class="record-name" onclick="event.preventDefault();entityDetail(${i})">${e.name}</a><span class="type-chip">${e.type}</span><span>${e.acn}<br><small style="color:#7d899a">ABN ${e.abn}</small></span><span>${e.relationship}</span><span>${e.owner}</span><span class="status-pill ${e.status==='Active'?'progress':'open'}">${e.status}</span><button class="mini">⋮</button></div>`}
function filterEntities(q){q=q.toLowerCase();document.querySelector('#entityRows').innerHTML=entities.filter(e=>(e.name+e.type+e.acn+e.abn).toLowerCase().includes(q)).map((e,i)=>entityRow(e,i)).join('')||'<div class="empty">No entities match this search.</div>'}
function entityDetail(i){let e=entities[i];document.querySelector('#app').innerHTML=shell(`<div class="page-head"><div><button class="card-link" onclick="go('entities')">← Back to entities</button><h1 style="margin-top:8px">${e.name}</h1><p>${e.type} · ${e.relationship} relationship</p></div><div class="quick-actions"><button class="btn" onclick="alert('Entity edit form opened')">Edit entity</button><button class="btn primary" onclick="openTaskDialog('${e.name}')">＋ Task</button></div></div><div class="record-layout"><div><section class="card card-pad"><div class="field-head"><div><h2>Entity details</h2><p class="helper">Business fact and legal identity are kept separately from relationship roles.</p></div></div><dl class="contact-card"><div><dt>Entity type</dt><dd>${e.type}</dd></div><div><dt>Relationship status</dt><dd>${e.status}</dd></div><div><dt>Australian Company Number</dt><dd>${e.acn}</dd></div><div><dt>Australian Business Number</dt><dd>${e.abn}</dd></div><div><dt>Legal name</dt><dd>${e.name}</dd></div><div><dt>Owner</dt><dd>${e.owner}</dd></div></dl></section><section class="card card-pad" style="margin-top:16px"><div class="field-head"><div><h2>Linked people</h2><p class="helper">Person–Entity links identify an individual’s role within an Entity.</p></div><button class="btn">＋ Link person</button></div><div class="field-table"><div class="tr th"><span>Person</span><span>Role</span><span>Primary</span><span>Since</span><span></span></div><div class="tr"><a class="record-name" href="#" onclick="event.preventDefault();personDetail(${i===0?0:i===1?2:i===2?3:4})">${i===0?'James Caldwell':i===1?'Sarah Mitchell':i===2?'Daniel Wu':'Olivia Bennett'}</a><span>${i===0?'Director':i===1?'Director':i===2?'Broker':'Adviser'}</span><span><span class="tag gray">Yes</span></span><span>2024</span><span>⋮</span></div></div></section></div><aside><section class="card card-pad"><h2>Related opportunities</h2><div class="rule"><i>✓</i><span><b>${i===0?'Harbourview Mixed Use':'Active relationship'}</b><br><small class="helper">${e.relationship} · Open</small></span></div><button class="btn" style="margin-top:15px" onclick="go('pipeline')">View pipeline</button></section><section class="card card-pad" style="margin-top:16px"><h2>Files</h2><p class="helper">SharePoint links only. Files stay in SharePoint.</p><button class="btn" onclick="alert('SharePoint folder would open')">Open folder</button></section></aside></div>`,'Entities / '+e.name)}
function openPersonDialog(){openSimpleDialog('New person','Create one record for one natural person. Enter person type, email and primary Entity link.','Save person')}
function openEntityDialog(){openSimpleDialog('New entity','ACN and ABN will be checked for duplicate and valid format before an Entity saves.','Save entity')}
function openTaskDialog(record){openSimpleDialog('Assign task to '+record,'Tasks can be assigned to any authorised user and will appear in their My tasks list.','Create task')}
function openNoteDialog(record){openSimpleDialog('Add note to '+record,'Notes are timestamped, append-only and editable by the author for 24 hours.','Add note')}
function openSimpleDialog(title,help,action){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><b>${title}</b><button class="x" onclick="closeModal()">×</button></div><div class="dialog-body"><div class="full"><p class="helper">${help}</p></div><div><label>Name or title</label><input class="input" placeholder="Enter value"></div><div><label>Owner or assignee</label><select class="select"><option>Alex Stewart</option><option>J. Davies</option><option>M. Khan</option></select></div><div class="full"><label>Notes</label><input class="input" placeholder="Optional details"></div></div><div class="footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="closeModal();alert('${action} saved')">${action}</button></div></div></div>`)}
function capitalPipeline(){return shell(`<div class="page-head"><div><h1>Capital Pipeline</h1><p>Investor Relations opportunities from first contact through to invested.</p></div><button class="btn primary" onclick="alert('New Investment Opportunity form opened')">＋ New investment opportunity</button></div><div class="gate">Lost or Dormant requires a reason before the status can change. Stage follow-up windows are configurable in Settings.</div><div class="card card-pad" style="margin-top:16px"><div class="field-head"><div><h2>Investment opportunities</h2><p class="helper">Move cards between stages. Expected fields become data gaps and do not stop progression.</p></div><div class="segmented"><button>List</button><button class="active">Kanban</button></div></div><div style="display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow:auto">${[['First Contact','$24m'],['In Discussion','$56m'],['Amount Indicated','$38m'],['Investor DD','$19m']].map((x,i)=>`<section class="card" style="background:#f5f7fb;min-height:360px;border-top:3px solid ${i===2?'var(--teal)':'var(--brand)'}"><div style="padding:15px;display:flex;justify-content:space-between"><b>${x[0]}</b><span class="tag gray">${i+2}</span></div><article class="card" style="padding:14px;margin:0 10px 10px"><b>${['Mitchell Family Office','Orion Private Wealth','Summit Capital','Westbourne Investors'][i]}</b><p class="helper" style="margin:6px 0">${x[1]} indicative commitment</p><span class="tag">Investor</span><div style="margin-top:12px;font-size:12px;color:#6e7d91">Follow-up due in ${i+1} days</div></article></section>`).join('')}</div></div>`,'Capital / Pipeline')}
function taskPage(){return shell(`<div class="page-head"><div><h1>My tasks</h1><p>Tasks assigned to you across People, Entities and both opportunity pipelines.</p></div><button class="btn primary" onclick="openTaskDialog('CRM')">＋ New task</button></div><div class="filter-bar"><input class="input" placeholder="⌕ Search tasks"><select class="select"><option>Open and In Progress</option><option>Overdue</option><option>Completed</option></select><select class="select"><option>All related records</option></select></div><div class="card card-pad"><div class="task-table"><div class="task-row head"><span></span><span>Task</span><span>Related to</span><span>Type</span><span>Due date</span><span>Status</span><span></span></div>${[['Follow up with borrower re updated financials','Harbourview Group','Credit','14 Apr 2026','Overdue','overdue'],['Prepare credit memo for committee','Riverside Logistics','Credit','15 Apr 2026','In progress','progress'],['Send capital update to investors','PI Credit Fund III','Capital','16 Apr 2026','Open','open'],['Arrange KYC documents','Southern Cross Developments','People','17 Apr 2026','Open','open']].map(t=>`<div class="task-row"><button class="check" onclick="this.style.background='var(--teal)'"></button><b>${t[0]}</b><span class="record-name">${t[1]}</span><span>${t[2]}</span><span>${t[3]}</span><span class="status-pill ${t[5]}">${t[4]}</span><button class="mini">⋮</button></div>`).join('')}</div></div>`,'Tasks')}
function reportsPage(){return shell(`<div class="page-head"><div><h1>Reports</h1><p>Run pipeline reports, apply filters and export permitted results.</p></div><button class="btn primary" onclick="alert('Report builder opened')">＋ Create report</button></div><div class="dashboard-grid"><section class="card card-pad"><h2>Weekly loan pipeline</h2><p class="helper">Open opportunities, stage, days in stage, weighted value and follow-up status.</p><button class="btn" onclick="alert('Loan pipeline report opened')">Run report</button></section><section class="card card-pad"><h2>Capital pipeline updates</h2><p class="helper">Open Investment Opportunities with indicative, committed and funded amounts.</p><button class="btn" onclick="alert('Capital pipeline report opened')">Run report</button></section><section class="card card-pad"><h2>New and lost records</h2><p class="helper">Created records and closed or dormant records within a selected period.</p><button class="btn" onclick="alert('New and lost report opened')">Run report</button></section></div>`,'Reports')}
function pipelineDashboard(){const columns=[['New enquiries',[['Riverside Logistics Facility','Riverside Logistics Ltd','Real Estate','$75,000,000','2 days in stage','AS'],['GreenField Solar Expansion','GreenField Energy Ltd','Renewable Energy','$120,000,000','5 days in stage','SC'],['Harbour View Mixed Use','Harbour View Developments','Construction','$60,000,000','Follow up in 3 days','AS']]],['Underwriting',[['Maple Residential Portfolio','Maple Homes Pty Ltd','Residential Real Estate','$85,000,000','7 days in stage','AS'],['Orion Healthcare Facility','Orion Healthcare Group','Healthcare','$40,000,000','Follow up in 5 days','MK'],['Summit Data Centre Phase II','Summit Digital Infrastructure','Infrastructure','$150,000,000','3 days in stage','SC']]],['Credit Committee',[['Pineview Industrial Park','Pineview Properties','Industrial Real Estate','$95,000,000','6 days in stage','AS'],['Silverline Hotel Refinancing','Silverline Hotels Ltd','Hospitality','$70,000,000','Follow up in 2 days','JD'],['Coastal Wind Project','Coastal Renewables Ltd','Renewable Energy','$110,000,000','4 days in stage','SC']]],['Documentation',[['Lakeside Office Tower','Lakeside REIT Management','Commercial Real Estate','$130,000,000','Follow up in 1 day','SC'],['Zenith Manufacturing Upgrade','Zenith Manufacturing Ltd','Manufacturing','$45,000,000','5 days in stage','MK'],['NorthPort Terminal Expansion','NorthPort Holdings','Transportation','$200,000,000','Follow up in 4 days','JD']]]];return shell(`<div class="page-head"><div><h1>Credit Pipeline</h1><p>Track and manage credit opportunities from origination to settlement.</p></div><div><button class="btn" onclick="alert('More actions opened')">•••</button> <button class="btn primary" onclick="alert('New opportunity form opened')">＋ New opportunity</button></div></div><div style="display:flex;gap:10px;align-items:center;margin:0 0 22px"><input class="input" style="width:270px" placeholder="⌕  Search opportunities..."><div class="avatar">AS</div> ><dd>${o.follow}</dd></div><div><dt>Created</dt><dd>${o.created}</dd></div><div><dt>Source</dt><dd>Direct</dd></div></dl></section><section class="card card-pad" style="margin-top:16px"><div class="activity-tabs"><button class="active">Activity</button><button onclick="alert('Details tab selected')">Details</button><button onclick="alert('Audit history tab selected')">Audit history</button></div><div class="activity-toolbar"><button class="btn primary" onclick="openTaskDialog('${o.name}')">☑ New task</button><button class="btn" onclick="alert('Teams dialler would open and a post-call log will be offered')">☎ Log call</button><button class="btn" onclick="alert('New calendar event panel opened')">▣ New event</button><button class="btn" onclick="alert('Outlook would open and the email pointer will be captured')">✉ Email</button><button class="btn" onclick="openNoteDialog('${o.name}')">＋ Note</button><span class="activity-filter">All time · All activities · <a href="#" class="record-name" onclick="event.preventDefault();alert('Activity filters opened')">Filter</a></span></div><div class="activity-group">Upcoming and overdue</div><div class="activity-item"><div class="activity-icon">☑</div><div><b>Prepare credit memo</b><small>Assigned to Alex Stewart by Sarah Chen · Due 24 Oct 2026</small><div class="activity-meta">High priority · Related to ${o.name}</div></div><span class="activity-status" style="color:var(--brand)">Overdue</span></div><div class="activity-item"><div class="activity-icon event">▣</div><div><b>Credit Committee meeting</b><small>24 Oct 2026, 10:00–11:00 · Attendees: Alex Stewart, Sarah Chen</small><div class="activity-meta">Calendar pointer</div></div><span class="activity-status">Tomorrow</span></div><div class="activity-group">October 2026</div><div class="activity-item"><div class="activity-icon email">✉</div><div><b>Updated financials requested</b><small>Email sent to ${o.party} · Attachment names recorded, body excluded</small><div class="activity-meta">Alex Stewart · 22 Oct 2026, 11:04</div></div><span class="activity-status">Sent</span></div><div class="activity-item"><div class="activity-icon">☎</div><div><b>Call with ${o.party}</b><small>Outbound Teams call · 12 minutes · Call note saved</small><div class="activity-meta">Alex Stewart · 21 Oct 2026, 15:42</div></div><span class="activity-status">Logged</span></div><div class="activity-item"><div class="activity-icon">✎</div><div><b>Note added</b><small>“Information pack received and added to SharePoint.”</small><div class="activity-meta">Alex Stewart · 21 Oct 2026, 10:15</div></div><span class="activity-status">Note</span></div></section><section class="card card-pad" style="margin-top:16px"><div class="field-head"><div><h2>Record audit trail</h2><p class="helper">Immutable history of create, changes, stage moves and connected-system calls.</p></div><button class="btn" onclick="alert('Audit export recorded')">Export audit</button></div><div class="timeline"><div class="event"><b>Stage changed</b><small>Credit DD → ${o.stage} · Alex Stewart · 22 Oct 2026, 14:25</small></div><div class="event"><b>Amount updated</b><small>Old: $55,000,000 · New: ${o.amount} · Alex Stewart · 21 Oct 2026, 12:06</small></div><div class="event"><b>Opportunity created</b><small>${o.owner} · ${o.created}</small></div></div></section></div><aside><section class="card card-pad"><h2>Stage readiness</h2><div class="gate">Expected information is incomplete: latest financials, valuation report. These data gaps do not stop the move unless a defined hard gate applies.</div><button class="btn" style="margin-top:14px">View stage fields</button></section><section class="card card-pad" style="margin-top:16px"><h2>Related tasks</h2><div class="rule"><i>!</i><span><b>Prepare credit memo</b><br><small class="helper">Created by Sarah Chen · Due 24 Oct 2026</small></span></div><button class="btn" style="margin-top:12px" onclick="openTaskDialog('${o.name}')">＋ Assign task</button></section><section function exportObject(kind,format){let rows=kind==='Loan Opportunities'?opportunityRows.filter(x=>x.type==='Credit'):kind==='Investment Opportunities'?opportunityRows.filter(x=>x.type==='Capital'):kind==='People'?people:entities;if(format==='pdf'){alert('PDF export includes the selected dashboard charts and a data summary. XLS and CSV exports remain list-only.');return}let keys=Object.keys(rows[0]||{}),csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\n');let blob=new Blob([csv],{type:format==='xls'?'application/vnd.ms-excel':'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=kind.toLowerCase().replaceAll(' ','-')+'.'+format;a.click();URL.revokeObjectURL(a.href)}

function validationScreen(){let rules=[['Text','Required, minimum/maximum length, regex pattern'],['Numeric','Required, minimum/maximum value, decimal precision'],['Boolean','Required true / false state'],['Date','Required, before/after date, date range'],['Single select','Required choice, allowed values'],['Multi select','Minimum / maximum selections, allowed values'],['Checkbox group','Required selection, selection count'],['Radio group','Required choice, allowed values']];return shell(`<div class="page-head"><div><h1>Validation rules</h1><p>Configure validations by field type. The system applies only the approved hard gates to block actions.</p></div><button class="btn primary" onclick="alert('Validation rule builder opened')">＋ Add validation rule</button></div><div class="gate">Configured validation rules protect data quality. Stage fields that are merely expected create data gaps and do not block a save or stage move.</div><div class="card card-pad" style="margin-top:16px"><div class="field-head"><div><h2>Field type validations</h2><p class="helper">Choose validation rules when defining a custom field.</p></div><button class="btn" onclick="exportMenu('Validation rules')">Export</button></div><div class="field-table"><div class="tr th"><span>Field type</span><span>Available validations</span><span>Hard gate use</span><span>Applies to</span><span></span></div>${rules.map((r,i)=>`<div class="tr"><b>${r[0]}</b><span>${r[1]}</span><span><span class="tag ${i===0||i===3?'':'gray'}">${i===0||i===3?'G2 format':'Configurable'}</span></span><span>All custom forms</span><span>›</span></div>`).join('')}</div></div><div class="card card-pad" style="margin-top:16px"><h2>Hard gate register</h2><p class="helper">G1 duplicate ACN or ABN, G2 invalid format, G3 Closed Lost reason, G4 Lost/Dormant reason, G5 LMS field-map confirmation, G6 legal name before Booking or Closed Won.</p></div>`,'Settings / Validations')}
function listOpportunityView(type){let rows=opportunityRows.filter(o=>type==='Loan'?o.type==='Credit':o.type==='Capital');return `<div class="table-wrap"><div class="record-table"><div class="record-row head"><span>Opportunity</span><span>Lead category</span><span>Lead status</span><span>Stage</span><span>Owner</span><span>Amount</span><span></span></div>${rows.map((o,i)=>`<div class="record-row" style="cursor:pointer" onclick="opportunityDetail(${opportunityRows.indexOf(o)})"><b class="record-name">${o.name}</b><span class="type-chip">${o.leadCategory||'Lead'}</span><span class="status-pill ${o.leadStatus==='Prospect'?'progress':'open'}">${o.leadStatus||'Suspect'}</span><span>${o.stage}</span><span>${o.owner}</span><span>${o.amount}</span><button class="mini">›</button></div>`).join('')}</div></div>`}

function opportunityWorkspace(type){let isLoan=type==='Loan', stages=isLoan?['Enquiry','Initial Assessment','ITS','Acceptance','Credit DD','IRC Approval','Docs and Legal','Booking']:['First Contact','In Discussion','Amount Indicated','Investor DD','Subscription Signed','Funded','Invested'];let rows=opportunityRows.filter(o=>isLoan?o.type==='Credit':o.type==='Capital');return shell(`<div class="page-head"><div><h1>${type} Opportunities</h1><p>Leads progress from suspect to prospect, then through the ${type.toLowerCase()} pipeline.</p></div><div class="quick-actions"><button class="btn" onclick="${isLoan?'creditDashboard()':'capitalDashboard()'}">${type} dashboard</button><button class="btn" onclick="exportMenu('${type} Opportunities')">Export</button><button class="btn primary" onclick="openOpportunityDialog('${isLoan?'Credit':'Capital'}')">＋ New ${type} Opportunity</button></div></div><div class="filter-bar"><input class="input" placeholder="⌕ Search opportunities" oninput="filterOpportunityCards(this.value)"><select class="select"><option>All lead categories</option><option>Lead</option><option>Qualified lead</option><option>Opportunity</option></select><select class="select"><option>All lead statuses</option><option>Suspect</option><option>Prospect</option><option>Qualified</option><option>Disqualified</option></select><select class="select"><option>All owners</option><option>Alex Stewart</option><option>J. Davies</option></select><button class="btn">More filters</button><div class="segmented" style="margin-left:auto"><button class="${opportunityView==='list'?'active':''}" onclick="opportunityView='list';render()">List</button><button class="${opportunityView==='kanban'?'active':''}" onclick="opportunityView='kanban';render()">Kanban</button></div></div>${opportunityView==='list'?listOpportunityView(type):`<div style="display:grid;grid-template-columns:repeat(${Math.min(stages.length,5)},minmax(220px,1fr));gap:14px;overflow:auto">${stages.map(stage=>`<section class="card" ondragover="event.preventDefault()" ondrop="moveOpportunity('${stage}')" style="border-top:3px solid ${stage===stages[0]?'var(--brand)':'var(--teal)'};background:#f1f5f9;min-height:420px"><div style="padding:14px 15px;border-bottom:1px solid #e3e9f0;display:flex;justify-content:space-between"><b>${stage}</b><span class="tag gray">${rows.filter(o=>o.stage===stage).length}</span></div><div style="padding:10px">${rows.filter(o=>o.stage===stage).map(o=>opportunityCard(o,stage)).join('')||'<p class="empty">Drag opportunities here</p>'}</div></section>`).join('')}</div>`}`,'Opportunities / '+type)}

iv style="display:flex;height:200px;gap:20px;align-items:end;border-bottom:1px solid var(--line);padding:0 20px">${data.map((d,i)=>`<div style="height:${35+i*12}%;background:${i===0?'#203757':i===1?'#227d83':'#55aaa5'};flex:1;border-radius:6px 6px 0 0;position:relative"><b style="position:absolute;top:-23px;width:100%;text-align:center;font-size:12px">${d[2]}</b></div>`).join('')}</div><div style="display:flex;justify-content:space-around;font-size:11px;color:#607087;padding:9px 0">${data.map(d=>`<span>${d[0]}</span>`).join('')}</div></section>`,'Dashboard / '+type)}

ctivity-feed .activity-icon.event{background:#f1e8ff;color:#834cd1}.activity-feed .activity-item b{display:block;font-size:14px}.activity-feed .activity-item small{display:block;color:#718096;margin-top:4px;line-height:1.4}.activity-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.activity-filter{margin-left:auto;color:#718096;font-size:12px}@media(max-width:700px){.activity-filter{margin-left:0;width:100%}.stage-tile{width:180px}}</style><section class="card card-pad stage-flow-card"><div class="stage-flow-head"><div><h2>Opportunity stage flow</h2><p>Completed stages, the current stage, and the stages still ahead. Scroll horizontally to see the complete pipeline.</p></div><span class="tag gray">${o.stage}</span></div><div class="stage-flow-scroll"><div class="stage-flow-strip">${stages.map((s,i)=>`<div class="stage-tile ${i<current?'done':i===current?'current':''}"><span class="stage-icon">${i<current?'✓':i===current?'●':'○'}</span><b style="display:inline">${s}</b><small>${i<current?'Completed':i===current?'Current stage':'Upcoming'}</small></div>`).join('')}</div></div></section>`}
